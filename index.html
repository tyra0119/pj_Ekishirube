<style>
/* 駅の案内サインの文法: 濃紺の帯、黄色い出口札、路線色のマゼンタ。左に手順、右に「縦の移動」と「ホームの位置」の図 */
:root {
  --bg: #eef0f3;
  --surface: #ffffff;
  --ink: #15181f;
  --muted: #596070;
  --line: #d3d8e0;
  --faint: #e5e8ed;
  --oedo: #cf3366;
  --oedo-soft: #fbe3ea;
  --exit: #f5c400;
  --exit-ink: #131313;
  --sign: #1c2333;
  --sign-ink: #ffffff;
  --walk: #8b93a3;
  --warn: #9a5b00;
  --warn-soft: #fff1d6;
  --stage: #e3e7ee;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-num: "Barlow Semi Condensed", "Zen Kaku Gothic New", "Arial Narrow", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111319; --surface: #1a1d25; --ink: #eceef3; --muted: #a2a9b8; --line: #2f3440; --faint: #232731;
    --oedo: #ff5d8c; --oedo-soft: #3b1d29; --sign: #0b0e15; --walk: #737b8c; --warn: #f2b45a; --warn-soft: #33270f;
    --stage: #0c0e13;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111319; --surface: #1a1d25; --ink: #eceef3; --muted: #a2a9b8; --line: #2f3440; --faint: #232731;
  --oedo: #ff5d8c; --oedo-soft: #3b1d29; --sign: #0b0e15; --walk: #737b8c; --warn: #f2b45a; --warn-soft: #33270f;
  --stage: #0c0e13;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; margin: 0; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 0 40px; }

/* サイン帯 */
.sign { background: var(--sign); color: var(--sign-ink); }
.sign .wrap { display: flex; align-items: center; gap: 14px; padding-block: 14px; }
.numbering { width: 46px; height: 46px; border-radius: 50%; border: 5px solid var(--oedo); background: #fff; color: #15181f;
  display: grid; place-items: center; line-height: 1; flex: none; font-family: var(--f-num); font-weight: 700; }
.numbering b { font-size: 11px; display: block; text-align: center; }
.numbering span { font-size: 17px; display: block; text-align: center; margin-top: -2px; }
.sign h1 { margin: 0; font-size: 22px; font-weight: 900; letter-spacing: .04em; text-wrap: balance; }
.sign h1 small { display: block; font-size: 12px; font-weight: 500; letter-spacing: .08em; opacity: .75; }

/* 条件の入力 */
.controls { display: grid; grid-template-columns: 1.1fr 1.4fr auto 1.4fr; gap: 10px 12px; align-items: end; margin-top: 18px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label, .lbl { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
select { font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  border-radius: 8px; padding: 9px 10px; width: 100%; min-width: 0; }
select:focus-visible, button:focus-visible, input:focus-visible + span { outline: 3px solid var(--oedo); outline-offset: 2px; }
.swap { font: inherit; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px;
  height: 42px; width: 42px; cursor: pointer; display: grid; place-items: center; }
.swap:hover { border-color: var(--oedo); color: var(--oedo); }
.profiles { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.profiles .lbl { margin-right: 4px; }
.seg { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: inline-block; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface);
  cursor: pointer; font-size: 14px; }
.seg input:checked + span { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* 要約 */
.summary { margin-top: 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 22px; padding: 16px 18px;
  background: var(--surface); border-radius: var(--r); border: 1px solid var(--line); }
.mins { font-family: var(--f-num); font-weight: 700; font-size: 44px; line-height: 1; }
.mins small { font-family: var(--f-body); font-size: 15px; font-weight: 500; margin-left: 2px; }
.route-line { font-weight: 700; font-size: 17px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--faint); color: var(--ink); white-space: nowrap; }
.chip.hl { background: var(--oedo-soft); color: var(--oedo); font-weight: 700; }
.exitbadge { display: inline-grid; place-items: center; min-width: 30px; height: 26px; padding: 0 6px; border-radius: 4px;
  background: var(--exit); color: var(--exit-ink); font-family: var(--f-num); font-weight: 700; font-size: 16px; line-height: 1; }
.platbadge { display: inline-flex; align-items: center; gap: 4px; height: 26px; padding: 0 8px; border-radius: 4px; background: var(--oedo);
  color: #fff; font-weight: 700; font-size: 14px; line-height: 1; white-space: nowrap; }

/* 本体 */
.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; margin-top: 20px; align-items: start; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.panel h2 { margin: 0 0 4px; font-size: 15px; font-weight: 700; letter-spacing: .04em; }
.panel .hint { margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.figs { display: grid; gap: 20px; min-width: 0; }
.svgbox { overflow-x: auto; }
.stage { position: relative; height: 440px; border-radius: 8px; overflow: hidden; background: var(--stage); touch-action: none; }
.stage canvas { display: block; width: 100% !important; height: 100% !important; cursor: grab; }
.stage canvas:active { cursor: grabbing; }
.views { position: absolute; top: 8px; left: 8px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 2; }
.views button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer; }
.views button:hover { border-color: var(--oedo); color: var(--oedo); }
.stage .fail { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; color: var(--muted); font-size: 13px; text-align: center; }
ol.steps li { cursor: pointer; }
svg { display: block; max-width: 100%; height: auto; }

/* 手順 */
ol.steps { list-style: none; margin: 6px 0 0; padding: 0; display: grid; }
ol.steps li { display: grid; grid-template-columns: 26px 40px minmax(0, 1fr); gap: 10px; padding: 10px 6px; border-radius: 8px;
  position: relative; }
ol.steps li + li { border-top: 1px solid var(--faint); }
ol.steps li.on { background: var(--oedo-soft); }
ol.steps li.minor { padding-block: 6px; }
.no { font-family: var(--f-num); font-weight: 600; color: var(--muted); font-size: 15px; padding-top: 8px; text-align: right; }
.ico { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; background: var(--faint); color: var(--ink); }
.ico.v { background: var(--oedo); color: #fff; }
.ico.gate { background: var(--sign); color: var(--sign-ink); }
.ico.exit { background: var(--exit); color: var(--exit-ink); font-family: var(--f-num); font-weight: 700; font-size: 16px; }
.ico.train { background: var(--oedo-soft); color: var(--oedo); }
li.minor .ico { width: 40px; height: 28px; background: transparent; color: var(--walk); }
.st-title { font-weight: 700; font-size: 16px; line-height: 1.45; padding-top: 8px; }
li.minor .st-title { font-weight: 500; font-size: 14px; color: var(--muted); padding-top: 3px; }
.st-detail { font-size: 13px; color: var(--muted); margin-top: 2px; }
.where { display: inline-block; margin-top: 6px; font-size: 13px; font-weight: 700; color: var(--oedo); background: var(--oedo-soft);
  padding: 2px 10px; border-radius: 999px; }
li.on .where { background: var(--surface); }

.notice { margin-top: 20px; padding: 14px 16px; border-radius: var(--r); background: var(--warn-soft); color: var(--ink);
  border: 1px solid var(--line); }
.notice b { color: var(--warn); }
.notice .alts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.notice button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 6px 12px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; }
.notice button:hover { border-color: var(--oedo); }

footer { margin-top: 28px; font-size: 12px; color: var(--muted); display: grid; gap: 4px; max-width: 80ch; }
footer a { color: inherit; }

/* SVG */
.lv-line { stroke: var(--faint); stroke-width: 1; }
.lv-txt { fill: var(--muted); font-size: 12px; font-family: var(--f-body); }
.route { fill: none; stroke: var(--oedo); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.route.walk { stroke: var(--walk); stroke-width: 3; }
.seg-g { cursor: default; }
.seg-g.on .route { stroke-width: 7; }
.seg-g.on .route.walk { stroke: var(--ink); }
.dist { fill: var(--muted); font-size: 11px; font-family: var(--f-num); font-weight: 600; }
.evbox { fill: var(--surface); stroke: var(--oedo); stroke-width: 2; }
.mark-lbl { fill: var(--ink); font-size: 12px; font-weight: 700; font-family: var(--f-body); }
.plat-body { fill: var(--faint); }
.car { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
.car.hl { fill: var(--oedo); stroke: var(--oedo); }
.car-no { fill: var(--muted); font-size: 12px; font-family: var(--f-num); font-weight: 600; }
.car-no.hl { fill: #fff; }
.fac { fill: var(--walk); }
.fac-txt { fill: var(--surface); font-size: 10px; font-weight: 700; font-family: var(--f-body); }
.fac.hl { fill: var(--oedo); }
.dir-txt { fill: var(--ink); font-size: 13px; font-weight: 700; font-family: var(--f-body); }
.sub-txt { fill: var(--muted); font-size: 11px; font-family: var(--f-body); }
.call { fill: var(--oedo); font-size: 12px; font-weight: 700; font-family: var(--f-body); }
.exit-r { fill: var(--exit); }
.exit-t { fill: var(--exit-ink); font-family: var(--f-num); font-weight: 700; font-size: 14px; }
.tr-r { fill: var(--oedo); }
.tr-t { fill: #fff; font-weight: 700; font-size: 12px; font-family: var(--f-body); }

@media (max-width: 860px) {
  .controls { grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); }
  .controls .f-station { grid-column: 1 / -1; }
  .grid { grid-template-columns: minmax(0, 1fr); }
  .figs { order: -1; }

@media (prefers-reduced-motion: no-preference) {

}

      boardCar = carOf(toPlat, st.nodes[r.end]);
      steps.push({ kind: 'end', icon: 'train', title: platLabel(st, toPlat) + 'に着く',
        detail: 'ホームに着いた場所は、進行方向の前から' + boardCar + '両目付近です。' + (toPlat.hs.length ? '（' + toPlat.hs.join('・') + '行き）' : ''),
        z: st.nodes[r.end][2], car: boardCar, plat: toPlat });
    } else {
      steps.push({ kind: 'end', icon: 'exit', title: to.id + '出入口から地上へ', detail: '', z: st.nodes[r.end][2] });
    }
    var used = segs.filter(function (s) { return s.kind === 'vert'; });
    return { steps: steps, segs: segs, route: r, minutes: Math.max(1, Math.round(totalSec / 60)),
      counts: counts, boardCar: boardCar, boardPlat: boardPlat, used: used };
  }

  // ホームに接する昇降設備の一覧（ホーム図に描く）
  function platformFacilities(st, p) {
    var seen = {}, out = [];
    st.links.forEach(function (l) {
      if (!(l[2] === STAIR || l[2] === ESC || l[2] === EV)) return;
      var a = st.nodes[l[0]], b = st.nodes[l[1]];
      if (Math.abs(a[2] - b[2]) < 0.01 && l[2] !== EV) return;
      [l[0], l[1]].forEach(function (ni) {
        var n = st.nodes[ni];
        if (n[2] !== p.level) return;
        var lat = Math.abs((n[0] - p.cx) * -p.ay + (n[1] - p.cy) * p.ax);
        if (lat > 15) return;
        var t = (n[0] - p.cx) * p.ax + (n[1] - p.cy) * p.ay;
        var key = l[2] + ':' + Math.round(t / 4);
        if (seen[key]) return;
        seen[key] = true;
        out.push({ mode: l[2], t: t, node: ni });
      });
    });
    return out;
  }

  return { guide: guide, exitNames: exitNames, platLabel: platLabel, levelName: levelName,
    platformFacilities: platformFacilities, carOf: carOf, PROFILES: PROFILES, CARS: CARS };
})();

// 立体表示: 通路網を帯、経路を管で描く。高さ = 階層 × LV（強調）
var View3D = (function () {
  var LV = 7;
  var renderer, scene, camera, controls, el, ro, started = false;
  var segTubes = [], routeTube, routeCurve, dot, edgeCum = [], edgeStep = [], total = 0;
  var home = null, platAxis = null, anim = null, play = null, onStep = null;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function css(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#888888'; }
  function V(st, i, lift) { var n = st.nodes[i]; return new THREE.Vector3(n[0], n[2] * LV + (lift || 0), -n[1]); }

  function label(text, bg, fg, h, anchorX) {
    var c = document.createElement('canvas'), ctx = c.getContext('2d'), fs = 44, padX = bg ? 18 : 4;
    var font = '700 ' + fs + 'px "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif';
    ctx.font = font;
    var w = Math.ceil(ctx.measureText(text).width) + padX * 2, hh = Math.round(fs * 1.5);
    c.width = w; c.height = hh;
    ctx.font = font;
    if (bg) {
      ctx.fillStyle = bg; var r = 10;
      ctx.beginPath(); ctx.moveTo(r, 0); ctx.lineTo(w - r, 0); ctx.quadraticCurveTo(w, 0, w, r); ctx.lineTo(w, hh - r);
      ctx.quadraticCurveTo(w, hh, w - r, hh); ctx.lineTo(r, hh); ctx.quadraticCurveTo(0, hh, 0, hh - r); ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0); ctx.fill();
    }
    ctx.fillStyle = fg; ctx.textBaseline = 'middle'; ctx.fillText(text, padX, hh / 2 + 2);
    var tex = new THREE.CanvasTexture(c); tex.minFilter = THREE.LinearFilter;
    var s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
    s.scale.set(h * w / hh, h, 1);
    s.center.set(anchorX == null ? 0.5 : anchorX, 0);
    s.renderOrder = 10;
    return s;
  }

  function ribbonMesh(pos, color, opacity) {
    var geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    return new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacity, side: THREE.DoubleSide, depthWrite: false }));
  }

  function polyCurve(pts) {
    var path = new THREE.CurvePath();
    for (var i = 1; i < pts.length; i++) path.add(new THREE.LineCurve3(pts[i - 1], pts[i]));
    return path;
  }
  function dedupe(pts) {
    return pts.filter(function (p, i) { return i === 0 || p.distanceTo(pts[i - 1]) > 0.05; });
  }

  function dispose() {
    if (!scene) return;
    scene.traverse(function (o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
    });
  }

  function init(container) {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    camera = new THREE.PerspectiveCamera(38, 1, 1, 6000);
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.12;
    controls.maxPolarAngle = Math.PI * 0.95;
    controls.addEventListener('start', function () { anim = null; play = null; });
    ro = new ResizeObserver(resize);
  }
  function resize() {
    if (!el || !renderer) return;
    var w = el.clientWidth, h = el.clientHeight;
    if (!w || !h) return;
    renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  }

  function build(st, g, from, to, container) {
    if (!window.THREE || !THREE.OrbitControls) {
      container.insertAdjacentHTML('beforeend', '<div class="fail">立体表示の部品を読み込めませんでした。通信状態を確かめて、ページを開き直してください。</div>');
      return;
    }
    if (!renderer) init(container);
    if (el) ro.unobserve(el);
    el = container;
    el.appendChild(renderer.domElement);
    ro.observe(el);
    dispose();
    scene = new THREE.Scene();
    scene.background = new THREE.Color(css('--stage'));
    segTubes = []; anim = null; play = null;

    var xs = st.nodes.map(function (n) { return n[0]; }), ys = st.nodes.map(function (n) { return n[1]; });
    var rawSpan = Math.max(Math.max.apply(null, xs) - Math.min.apply(null, xs), Math.max.apply(null, ys) - Math.min.apply(null, ys));
    LV = Math.max(8, rawSpan * 0.075);
    var cWalk = css('--walk'), cMuted = css('--muted'), cInk = css('--ink'), cOedo = css('--oedo'), cExit = css('--exit');

    // 通路網（データ全体）
    var pass = [], vert = [], shafts = [];
    st.links.forEach(function (l) {
      var a = V(st, l[0]), b = V(st, l[1]);
      var dx = b.x - a.x, dz = b.z - a.z, hl = Math.hypot(dx, dz);
      if (l[2] === 5 && Math.abs(a.y - b.y) > 0.1) { shafts.push([a, b]); return; }
      if (hl < 0.3) return;
      var isV = (l[2] === 2 || l[2] === 4) && Math.abs(a.y - b.y) > 0.1;
      var w = isV ? 1.8 : 2.6, px = -dz / hl * w / 2, pz = dx / hl * w / 2;
      (isV ? vert : pass).push(a.x + px, a.y, a.z + pz, a.x - px, a.y, a.z - pz, b.x + px, b.y, b.z + pz,
        a.x - px, a.y, a.z - pz, b.x - px, b.y, b.z - pz, b.x + px, b.y, b.z + pz);
    });
    scene.add(ribbonMesh(pass, cWalk, 0.32));
    scene.add(ribbonMesh(vert, cMuted, 0.55));
    shafts.forEach(function (s) {
      var h = Math.abs(s[0].y - s[1].y);
      var m = new THREE.Mesh(new THREE.BoxGeometry(2.4, h, 2.4), new THREE.MeshBasicMaterial({ color: cMuted, transparent: true, opacity: 0.28, depthWrite: false }));
      m.position.set((s[0].x + s[1].x) / 2, (s[0].y + s[1].y) / 2, (s[0].z + s[1].z) / 2);
      scene.add(m);
    });

    // 範囲
    var box = new THREE.Box3();
    st.nodes.forEach(function (n, i) { box.expandByPoint(V(st, i)); });
    var size = box.getSize(new THREE.Vector3()), mid = box.getCenter(new THREE.Vector3());
    var span = Math.max(size.x, size.z);

    // 地上の目盛り
    var gsz = Math.ceil(span / 25) * 25 + 50, grid = new THREE.GridHelper(gsz, gsz / 25, cMuted, cMuted);
    grid.material.transparent = true; grid.material.opacity = 0.1; grid.material.depthWrite = false;
    grid.position.set(mid.x, 0, mid.z);
    scene.add(grid);

    // ホーム: 乗るホームは8両分に区切り、乗る位置の車両を塗る
    platAxis = null;
    st.plats.forEach(function (p) {
      var axis = new THREE.Vector3(p.ax, 0, -p.ay), len = p.max - p.min, tm = (p.min + p.max) / 2;
      var y = p.level * LV - 0.5, isBoard = g.boardPlat && g.boardPlat.id === p.id;
      var rotY = Math.atan2(p.ay, p.ax);
      if (!isBoard) return;
      platAxis = axis.clone();
      var cl = len / Guide.CARS;
      for (var c = 1; c <= Guide.CARS; c++) {
        var t = p.max - (c - 0.5) * cl, hl = c === g.boardCar;
        var m = new THREE.Mesh(new THREE.BoxGeometry(cl - 1.2, 0.8, 7),
          new THREE.MeshBasicMaterial({ color: hl ? cOedo : cMuted, transparent: true, opacity: hl ? 0.85 : 0.22, depthWrite: false }));
        m.position.set(p.cx + p.ax * t, y, -(p.cy + p.ay * t));
        m.rotation.y = rotY;
        scene.add(m);
        if (hl) {
          var lb = label('前から' + c + '両目', cOedo, '#ffffff', span * 0.04);
          lb.position.set(m.position.x, y + 3, m.position.z); scene.add(lb);
        }
      }
      // 進行方向
      var front = new THREE.Vector3(p.cx + p.ax * p.max, y + 1, -(p.cy + p.ay * p.max));
      scene.add(new THREE.ArrowHelper(axis, front, 16, new THREE.Color(cInk).getHex(), 5, 3.5));
      var dl = label((p.next ? p.next + '方面' : '終点') + 'へ', null, cInk, span * 0.035);
      dl.position.copy(front.clone().add(axis.clone().multiplyScalar(20))); scene.add(dl);
    });

    // 出入口
    var meta = st._meta;
    Object.keys(meta.exits).forEach(function (name) {
      var ids = meta.exits[name], p = new THREE.Vector3();
      ids.forEach(function (i) { p.add(V(st, i)); }); p.divideScalar(ids.length);
      var chosen = (from.type === 'exit' && from.id === name) || (to.type === 'exit' && to.id === name);
      var lb = label(name, cExit, '#131313', span * (chosen ? 0.045 : 0.03));
      lb.material.opacity = chosen ? 1 : 0.7;
      lb.position.set(p.x, p.y + 2, p.z); scene.add(lb);
    });

    // 階の名前（左端）
    var levels = {};
    g.segs.forEach(function (s) { levels[s.z0] = 1; levels[s.z1] = 1; });
    levels[0] = 1;
    Object.keys(levels).map(Number).forEach(function (z) {
      if (Math.abs(z - Math.round(z)) > 0.01) return;
      var lb = label(Guide.levelName(st, z), null, cMuted, span * 0.03, 1);
      lb.position.set(box.min.x - 6, z * LV, mid.z); scene.add(lb);
    });

    // 経路
    var E = g.route.edges, pts = [V(st, g.route.start, 0.8)];
    edgeCum = [0]; edgeStep = []; total = 0;
    var stepOfEdge = new Map();
    g.segs.forEach(function (s, k) { s.edges.forEach(function (e) { stepOfEdge.set(e, k + 1); }); });
    var lastStep = 1;
    E.forEach(function (e) {
      var p = V(st, e.b, 0.8), d = p.distanceTo(pts[pts.length - 1]);
      var k = stepOfEdge.has(e) ? stepOfEdge.get(e) : lastStep; lastStep = k;
      if (d > 0.05) { pts.push(p); total += d; edgeCum.push(total); edgeStep.push(k); }
    });
    if (pts.length < 2) pts.push(pts[0].clone().add(new THREE.Vector3(0.1, 0, 0)));
    routeCurve = polyCurve(pts);
    routeTube = new THREE.Mesh(new THREE.TubeGeometry(routeCurve, Math.min(1500, pts.length * 10), 0.9, 8, false),
      new THREE.MeshBasicMaterial({ color: cOedo }));
    scene.add(routeTube);

    // 手順ごとの強調用の管（普段は隠す）
    g.segs.forEach(function (s, k) {
      var sp = dedupe([V(st, s.from, 0.8)].concat(s.edges.map(function (e) { return V(st, e.b, 0.8); })));
      if (sp.length < 2) return;
      var t = new THREE.Mesh(new THREE.TubeGeometry(polyCurve(sp), sp.length * 10, 1.8, 8, false),
        new THREE.MeshBasicMaterial({ color: cInk, transparent: true, opacity: 0.9 }));
      t.visible = false; t.userData.step = k + 1;
      t.userData.center = new THREE.Box3().setFromPoints(sp).getCenter(new THREE.Vector3());
      segTubes.push(t); scene.add(t);
    });

    // 始点と終点
    [[from, pts[0]], [to, pts[pts.length - 1]]].forEach(function (pair) {
      var ep = pair[0], p = pair[1];
      var ball = new THREE.Mesh(new THREE.SphereGeometry(1.8, 16, 12), new THREE.MeshBasicMaterial({ color: cInk }));
      ball.position.copy(p); scene.add(ball);
      if (ep.type === 'plat') {
        var pl = st.plats.filter(function (x) { return x.id === ep.id; })[0];
        var lb = label(pl.code + '番線', cOedo, '#ffffff', span * 0.045);
        lb.position.set(p.x, p.y + LV * 0.9, p.z); scene.add(lb);
      }
    });

    // 歩く人
    dot = new THREE.Mesh(new THREE.SphereGeometry(2.2, 20, 14), new THREE.MeshBasicMaterial({ color: cExit }));
    dot.position.copy(pts[0]); scene.add(dot);

    // 視点
    var rb = new THREE.Box3().setFromPoints(pts);
    rb.expandByScalar(18);
    var rc = rb.getCenter(new THREE.Vector3()), rs = rb.getSize(new THREE.Vector3()).length();
    var dist = rs / 2 / Math.sin(THREE.MathUtils.degToRad(19)) * 0.95;
    home = { center: rc, dist: dist };
    resize();
    setView('oblique', true);

    if (!started) { started = true; loop(); }
  }

  function viewPos(kind) {
    var c = home.center, d = home.dist;
    if (kind === 'top') return c.clone().add(new THREE.Vector3(0.01, d, 0.01));
    if (kind === 'side') {
      var ax = platAxis || new THREE.Vector3(1, 0, 0);
      var perp = new THREE.Vector3(-ax.z, 0, ax.x).normalize();
      return c.clone().add(perp.multiplyScalar(d)).add(new THREE.Vector3(0, d * 0.08, 0));
    }
    return c.clone().add(new THREE.Vector3(0.6, 0.42, 0.75).normalize().multiplyScalar(d));
  }

  function moveTo(pos, target, instant) {
    if (instant || reduce) { camera.position.copy(pos); controls.target.copy(target); controls.update(); anim = null; return; }
    anim = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, s: performance.now(), d: 650 };
  }

  function setView(kind, instant) {
    if (!home) return;
    play = null;
    if (kind === 'play') {
      play = { s: performance.now(), d: Math.max(8000, total * 55) };
      return;
    }
    moveTo(viewPos(kind), home.center.clone(), instant);
  }

  function highlight(i) {
    segTubes.forEach(function (t) { t.visible = t.userData.step === i; });
    if (routeTube) { routeTube.material.transparent = i >= 0; routeTube.material.opacity = i >= 0 ? 0.45 : 1; }
  }

  function focus(i) {
    if (!home) return;
    if (i < 0) { setView('oblique'); return; }
    var t = segTubes.filter(function (s) { return s.userData.step === i; })[0];
    if (!t) return;
    play = null;
    var off = camera.position.clone().sub(controls.target).normalize().multiplyScalar(Math.max(70, home.dist * 0.45));
    moveTo(t.userData.center.clone().add(off), t.userData.center.clone());
  }

  function stepAt(u) {
    var dlen = u * total;
    for (var k = 1; k < edgeCum.length; k++) if (edgeCum[k] >= dlen) return edgeStep[k - 1];
    return edgeStep[edgeStep.length - 1];
  }

  var lastPlayStep = -1;
  function loop() {
    requestAnimationFrame(loop);
    if (!scene || !el || !el.isConnected) return;
    var now = performance.now();
    if (anim) {
      var k = Math.min(1, (now - anim.s) / anim.d), e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
      camera.position.lerpVectors(anim.p0, anim.p1, e); controls.target.lerpVectors(anim.t0, anim.t1, e);
      if (k >= 1) anim = null;
    }
    if (routeCurve && dot) {
      var u;
      if (play) {
        u = Math.min(1, (now - play.s) / play.d);
        var p = routeCurve.getPointAt(u), tan = routeCurve.getTangentAt(Math.min(0.999, u));
        var flat = new THREE.Vector3(tan.x, 0, tan.z); if (flat.lengthSq() < 1e-4) flat.set(1, 0, 0); flat.normalize();
        var want = p.clone().sub(flat.clone().multiplyScalar(Math.max(45, LV * 3.2))).add(new THREE.Vector3(0, Math.max(30, LV * 2.2), 0));
        camera.position.lerp(want, 0.06); controls.target.lerp(p, 0.12);
        var s = stepAt(u);
        if (s !== lastPlayStep) { lastPlayStep = s; if (onStep) onStep(s); }
        if (u >= 1) { play = null; lastPlayStep = -1; if (onStep) onStep(-1); }
      } else {
        u = reduce ? 0 : ((now / 9000) % 1);
      }
      dot.position.copy(routeCurve.getPointAt(u));
    }
    controls.update();
    renderer.render(scene, camera);
  }

  return { build: build, view: setView, highlight: highlight, focus: focus,
    set onStep(fn) { onStep = fn; } };
})();

</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var state = { st: null, hover: -1 };

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  var ICON = {
    walk: '<path d="M3 10h13M12 5l5 5-5 5"/>',
    stairUp: '<path d="M2 17h4v-4h4V9h4V5h4"/>',
    stairDown: '<path d="M2 5h4v4h4v4h4v4h4"/>',
    escUp: '<path d="M2 16h4l8-10h4"/><path d="M6 16l8-10" opacity=".45"/>',
    escDown: '<path d="M2 4h4l8 10h4"/>',
    ev: '<rect x="4" y="2.5" width="12" height="15" rx="1.5"/><path d="M7.5 8.5L10 6l2.5 2.5M7.5 11.5L10 14l2.5-2.5"/>',
    gate: '<path d="M5 3v14M15 3v14M8 10h5M11 7.5L13.5 10 11 12.5"/>',
    train: '<rect x="4" y="2.5" width="12" height="12" rx="3"/><path d="M4 9h12M7 17.5l1.5-3M13 17.5l-1.5-3"/><circle cx="7.5" cy="11.8" r=".6"/><circle cx="12.5" cy="11.8" r=".6"/>'
  };
  function icon(name, size) {
    size = size || 22;
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + ICON[name] + '</svg>';
  }

  // ---------- 入力 ----------
  STATIONS.forEach(function (s, i) {
    var o = document.createElement('option'); o.value = i; o.textContent = s.code + '　' + s.name; $('station').appendChild(o);
  });

  function fillEndpoints(keepFrom, keepTo) {
    var st = state.st;
    ['from', 'to'].forEach(function (k) {
      var sel = $(k); sel.innerHTML = '';
      var g1 = document.createElement('optgroup'); g1.label = '出入口';
      Guide.exitNames(st).forEach(function (n) { var o = document.createElement('option'); o.value = 'exit:' + n; o.textContent = n + ' 出入口'; g1.appendChild(o); });
      var g2 = document.createElement('optgroup'); g2.label = 'ホーム';
      st.plats.forEach(function (p) { var o = document.createElement('option'); o.value = 'plat:' + p.id; o.textContent = Guide.platLabel(st, p); g2.appendChild(o); });
      sel.appendChild(g1); sel.appendChild(g2);
    });
    var exits = Guide.exitNames(st);
    $('from').value = keepFrom && hasOpt('from', keepFrom) ? keepFrom : 'exit:' + exits[0];
    var dp = st.plats.filter(function (p) { return p.next; })[0] || st.plats[0];
    $('to').value = keepTo && hasOpt('to', keepTo) ? keepTo : 'plat:' + dp.id;
  }
  function hasOpt(id, v) { return Array.prototype.some.call($(id).options, function (o) { return o.value === v; }); }
  function parseEp(v) { var i = v.indexOf(':'); return { type: v.slice(0, i), id: v.slice(i + 1) }; }
  function profile() { return document.querySelector('input[name=profile]:checked').value; }

  function setStation(i, from, to) {
    state.st = STATIONS[i];
    $('station').value = i;
    $('stname').textContent = state.st.name;
    var num = state.st.code.split('-');
    $('numbering').innerHTML = '<div><b>' + num[0] + '</b><span>' + num[1] + '</span></div>';
    fillEndpoints(from, to);
    run();
  }

  $('station').addEventListener('change', function () { setStation(+this.value); });
  $('from').addEventListener('change', run);
  $('to').addEventListener('change', run);
  document.querySelectorAll('input[name=profile]').forEach(function (r) { r.addEventListener('change', run); });
  $('swap').addEventListener('click', function () { var a = $('from').value; $('from').value = $('to').value; $('to').value = a; run(); });
  $('form').addEventListener('submit', function (e) { e.preventDefault(); });

  // ---------- 表示 ----------
  function epBadge(ep) {
    if (ep.type === 'exit') return '<span class="exitbadge">' + esc(ep.id) + '</span>';
    var p = state.st.plats.filter(function (x) { return x.id === ep.id; })[0];
    return '<span class="platbadge">' + icon('train', 15) + esc(Guide.platLabel(state.st, p)) + '</span>';
  }

  function run() {
    var st = state.st, from = parseEp($('from').value), to = parseEp($('to').value), pr = profile();
    var out = $('out');
    if (from.type === to.type && from.id === to.id) {
      out.innerHTML = '<div class="notice">出発と到着が同じです。どちらかを変えてください。</div>'; return;
    }
    if (from.type === 'exit' && to.type === 'exit') {
      out.innerHTML = '<div class="notice">出入口どうしの案内には対応していません。片方をホームにしてください。</div>'; return;
    }
    var g = Guide.guide(st, from, to, pr);
    if (!g) { out.innerHTML = noRoute(st, from, to, pr); bindAlts(); return; }
    out.innerHTML =
      summaryHTML(g, from, to) +
      '<div class="grid">' +
        '<section class="panel" aria-labelledby="h-steps"><h2 id="h-steps">歩く順番</h2>' + stepsHTML(g) + '</section>' +
        '<div class="figs">' +
          '<section class="panel" aria-labelledby="h-3d"><h2 id="h-3d">立体で見る</h2><p class="hint">ドラッグで回転、ホイールやピンチで拡大します。手順を押すとその場所に寄ります。高さは見やすいように強調しています。</p>' +
            '<div class="stage" id="stage"><div class="views">' +
              '<button type="button" data-view="oblique">斜めから</button><button type="button" data-view="side">横から</button><button type="button" data-view="top">真上から</button><button type="button" data-view="play">歩く様子</button>' +
            '</div></div></section>' +
          '<section class="panel" aria-labelledby="h-plat"><h2 id="h-plat">ホームのどこか</h2><p class="hint">電車の向きと、使う昇降設備の位置です。</p><div class="svgbox">' + platformSVG(g) + '</div></section>' +
          '<section class="panel" aria-labelledby="h-sec"><h2 id="h-sec">上り下りの流れ</h2><p class="hint">駅を横から見た図です。横は歩く距離、縦は深さを表します。</p><div class="svgbox">' + sectionSVG(g, from, to) + '</div></section>' +
        '</div>' +
      '</div>';
    View3D.build(st, g, from, to, $('stage'));
    document.querySelectorAll('[data-view]').forEach(function (b) {
      b.addEventListener('click', function () { View3D.view(b.dataset.view); });
    });
    bindHover();
  }

  function summaryHTML(g, from, to) {
    var c = g.counts, chips = [];
    if (c[2]) chips.push('<span class="chip">階段 ' + c[2] + '回</span>');
    if (c[4]) chips.push('<span class="chip">エスカレーター ' + c[4] + '回</span>');
    if (c[5]) chips.push('<span class="chip">エレベーター ' + c[5] + '回</span>');
    if (!c[2] && !c[4] && !c[5]) chips.push('<span class="chip">上り下りなし</span>');
    if (g.boardCar) chips.push('<span class="chip hl">' + (from.type === 'plat' ? '降りる位置' : '着く位置') + '：前から' + g.boardCar + '両目付近</span>');
    return '<div class="summary">' +
      '<div class="mins">約' + g.minutes + '<small>分</small></div>' +
      '<div style="display:grid;gap:6px;min-width:0">' +
        '<div class="route-line">' + epBadge(from) + '<span aria-hidden="true">→</span><span class="sr-only" style="position:absolute;left:-9999px">から</span>' + epBadge(to) + '</div>' +
        '<div class="chips">' + chips.join('') + '</div>' +
      '</div></div>';
  }

  function stepIcon(s) {
    if (s.icon === 'exit') {
      var name = s.kind === 'start' ? $('from').value.slice(5) : $('to').value.slice(5);
      return '<div class="ico exit">' + esc(name) + '</div>';
    }
    if (s.icon === 'train') return '<div class="ico train">' + icon('train') + '</div>';
    if (s.icon === 'walk') return '<div class="ico">' + icon('walk') + '</div>';
    if (s.icon === 'gate') return '<div class="ico gate">' + icon('gate') + '</div>';
    if (s.icon === 'ev') return '<div class="ico v">' + icon('ev') + '</div>';
    if (s.icon === 'esc') return '<div class="ico v">' + icon(s.up ? 'escUp' : 'escDown') + '</div>';
    return '<div class="ico v">' + icon(s.up ? 'stairUp' : 'stairDown') + '</div>';
  }

  function stepsHTML(g) {
    return '<ol class="steps">' + g.steps.map(function (s, i) {
      var minor = s.kind === 'walk' && !s.detail;
      return '<li data-i="' + i + '" class="' + (minor ? 'minor' : '') + '">' +
        '<div class="no">' + (i + 1) + '</div>' + stepIcon(s) +
        '<div style="min-width:0"><div class="st-title">' + esc(s.title) + '</div>' +
        (s.detail ? '<div class="st-detail">' + esc(s.detail) + '</div>' : '') +
        (s.where ? '<span class="where">' + esc(s.where) + '</span>' : '') +
        '</div></li>';
    }).join('') + '</ol>';
  }

  // 断面図: 横=歩いた距離（圧縮）、縦=深さ
  function sectionSVG(g, from, to) {
    var st = state.st, segs = g.segs;
    var W = 640, L = 108, R = 46, T = 34, rowH = 40;
    var zs = segs.reduce(function (a, s) { a.push(s.z0, s.z1); return a; }, []);
    var zmax = Math.max.apply(null, zs), zmin = Math.min.apply(null, zs);
    var H = T + (zmax - zmin) * rowH + 42;
    var y = function (z) { return T + (zmax - z) * rowH; };
    var vw = { 2: 34, 4: 34, 5: 16 };
    var fixed = 0, flex = 0;
    segs.forEach(function (s) { if (s.kind === 'vert') fixed += vw[s.mode]; else if (s.kind === 'gate') fixed += 18; else flex += Math.sqrt(Math.max(s.len, 4)); });
    var scale = flex ? (W - L - R - fixed) / flex : 0;
    var h = [];
    // 階の線と名前（整数の階と、ホーム・改札の階）
    var labeled = {};
    zs.forEach(function (z) { labeled[z] = true; });
    Object.keys(labeled).map(Number).sort(function (a, b) { return b - a; }).forEach(function (z) {
      if (Math.abs(z - Math.round(z)) > 0.01) return;
      h.push('<line class="lv-line" x1="' + (L - 6) + '" x2="' + (W - 8) + '" y1="' + y(z) + '" y2="' + y(z) + '"/>');
      h.push('<text class="lv-txt" x="' + (L - 12) + '" y="' + (y(z) + 4) + '" text-anchor="end">' + esc(Guide.levelName(st, z)) + '</text>');
    });
    var x = L, stepIdx = 1;
    var startX = x, startY = y(segs[0].z0);
    segs.forEach(function (s) {
      var d, x0 = x, y0 = y(s.z0), y1 = y(s.z1), body = '';
      if (s.kind === 'walk') {
        var w = Math.sqrt(Math.max(s.len, 4)) * scale; x += w;
        body = '<path class="route walk" d="M' + x0 + ' ' + y0 + 'H' + x + '"/>';
        if (w > 34) body += '<text class="dist" x="' + ((x0 + x) / 2) + '" y="' + (y0 + 15) + '" text-anchor="middle">' + Math.round(s.len) + 'm</text>';
      } else if (s.kind === 'gate') {
        x += 18;
        body = '<path class="route walk" d="M' + x0 + ' ' + y0 + 'H' + x + '"/>' +
          '<path d="M' + (x0 + 5) + ' ' + (y0 - 11) + 'v22M' + (x0 + 13) + ' ' + (y0 - 11) + 'v22" stroke="var(--ink)" stroke-width="3" stroke-linecap="round"/>' +
          '<text class="mark-lbl" x="' + (x0 + 9) + '" y="' + (y0 - 16) + '" text-anchor="middle">改札</text>';
      } else if (s.mode === 2) {
        var w2 = vw[2]; x += w2; var n = Math.max(3, Math.round(Math.abs(s.z1 - s.z0) * 4)), dx = w2 / n, dy = (y1 - y0) / n;
        d = 'M' + x0 + ' ' + y0;
        for (var k = 0; k < n; k++) d += (dy > 0 ? 'h' + dx + 'v' + dy : 'v' + dy + 'h' + dx);
        body = '<path class="route" d="' + d + '"/>';
      } else if (s.mode === 4) {
        x += vw[4];
        body = '<path class="route" d="M' + x0 + ' ' + y0 + 'L' + x + ' ' + y1 + '"/>';
      } else {
        x += vw[5]; var cx = x0 + 8;
        body = '<path class="route" d="M' + x0 + ' ' + y0 + 'H' + cx + 'V' + y1 + 'H' + x + '"/>' +
          '<rect class="evbox" x="' + (cx - 7) + '" y="' + (Math.min(y0, y1) - 2) + '" width="14" height="' + (Math.abs(y1 - y0) + 4) + '" rx="3"/>' +
          '<text class="mark-lbl" x="' + cx + '" y="' + ((y0 + y1) / 2 + 4) + '" text-anchor="middle" style="font-size:9px">EV</text>';
      }
      h.push('<g class="seg-g" data-i="' + stepIdx + '">' + body + '</g>');
      stepIdx++;
    });
    // 始点・終点
    h.push(endMark(startX, startY, from, 'start'));
    h.push(endMark(x, y(segs[segs.length - 1].z1), to, 'end'));
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="経路の断面図">' + h.join('') + '</svg>';
  }
  function endMark(x, y, ep, kind) {
    var lab = ep.type === 'exit' ? ep.id : state.st.plats.filter(function (p) { return p.id === ep.id; })[0].code + '番線';
    var w = ep.type === 'exit' ? Math.max(26, lab.length * 9 + 10) : lab.length * 12 + 10;
    var bx = kind === 'start' ? x - w / 2 : x - w / 2;
    var by = y - 30;
    var cls = ep.type === 'exit' ? ['exit-r', 'exit-t'] : ['tr-r', 'tr-t'];
    return '<circle cx="' + x + '" cy="' + y + '" r="5" fill="var(--ink)"/>' +
      '<rect class="' + cls[0] + '" x="' + bx + '" y="' + by + '" width="' + w + '" height="20" rx="3"/>' +
      '<text class="' + cls[1] + '" x="' + x + '" y="' + (by + 15) + '" text-anchor="middle">' + esc(lab) + '</text>';
  }

  // ホーム図: 進行方向を右にとり、8両の電車と昇降設備を並べる
  function platformSVG(g) {
    var st = state.st, p = g.boardPlat;
    if (!p) return '<p class="hint">この経路はホームを通りません。</p>';
    var W = 640, L = 36, R = 36, top = 40, carH = 34, platY = top + carH + 10, platH = 26;
    var X = function (t) { return L + (t - p.min) / (p.max - p.min) * (W - L - R); };
    var h = [];
    // 進行方向
    h.push('<text class="dir-txt" x="' + (W - R) + '" y="18" text-anchor="end">' + esc(p.next ? p.next + '方面' : '終点') + ' ▶</text>');
    h.push('<text class="sub-txt" x="' + L + '" y="18">' + esc(p.code + '番線' + (p.hs.length ? '（' + p.hs.join('・') + '行き）' : '')) + '</text>');
    // 車両（右が先頭）
    var cw = (W - L - R) / Guide.CARS;
    for (var c = 1; c <= Guide.CARS; c++) {
      var cx0 = W - R - c * cw + 2, hl = c === g.boardCar;
      var r = c === 1 ? 'M' + cx0 + ' ' + top + 'h' + (cw - 14) + 'q10 0 10 12v' + (carH - 12) + 'h' + -(cw - 4) + 'z' : null;
      if (r) h.push('<path class="car' + (hl ? ' hl' : '') + '" d="' + r + '"/>');
      else h.push('<rect class="car' + (hl ? ' hl' : '') + '" x="' + cx0 + '" y="' + top + '" width="' + (cw - 4) + '" height="' + carH + '" rx="3"/>');
      h.push('<text class="car-no' + (hl ? ' hl' : '') + '" x="' + (cx0 + (cw - 4) / 2) + '" y="' + (top + carH / 2 + 5) + '" text-anchor="middle">' + c + '</text>');
    }
    h.push('<text class="sub-txt" x="' + L + '" y="' + (top - 6) + '">数字は前から数えた両数</text>');
    // ホーム
    h.push('<rect class="plat-body" x="' + L + '" y="' + platY + '" width="' + (W - L - R) + '" height="' + platH + '" rx="4"/>');
    // 昇降設備
    var used = {};
    g.steps.forEach(function (s) { if (s.platNode != null && s.plat && s.plat.id === p.id) used[s.platNode] = s; });
    var facs = Guide.platformFacilities(st, p);
    var lab = { 2: '階', 4: 'エ', 5: 'EV' };
    var callouts = [];
    facs.forEach(function (f) {
      var isUsed = used[f.node] || facs.some(function (o) { return false; });
      var fx = X(f.t), fy = platY + platH / 2;
      var w = f.mode === 5 ? 22 : 16;
      h.push('<rect class="fac' + (isUsed ? ' hl' : '') + '" x="' + (fx - w / 2) + '" y="' + (fy - 8) + '" width="' + w + '" height="16" rx="3"/>');
      h.push('<text class="fac-txt" x="' + fx + '" y="' + (fy + 4) + '" text-anchor="middle">' + lab[f.mode] + '</text>');
      if (isUsed) callouts.push({ x: fx, s: isUsed });
    });
    // 使う設備に吹き出し
    Object.keys(used).forEach(function (k) {
      var s = used[k];
      if (callouts.some(function (c) { return c.s === s; })) return;
      var n = st.nodes[+k], t = (n[0] - p.cx) * p.ax + (n[1] - p.cy) * p.ay;
      var fx = X(t), fy = platY + platH / 2;
      h.push('<rect class="fac hl" x="' + (fx - 9) + '" y="' + (fy - 8) + '" width="18" height="16" rx="3"/>');
      callouts.push({ x: fx, s: s });
    });
    callouts.forEach(function (c) {
      var word = c.s.mode === 5 ? 'このエレベーター' : c.s.mode === 4 ? 'このエスカレーター' : 'この階段';
      var anchor = c.x < L + 60 ? 'start' : c.x > W - R - 60 ? 'end' : 'middle';
      h.push('<path d="M' + c.x + ' ' + (platY + platH + 2) + 'v12" stroke="var(--oedo)" stroke-width="2"/>');
      h.push('<text class="call" x="' + c.x + '" y="' + (platY + platH + 30) + '" text-anchor="' + anchor + '">' + word + '（' + (c.s.up ? '上り' : '下り') + '）</text>');
    });
    // 凡例
    var ly = platY + platH + 56;
    h.push('<rect class="fac" x="' + L + '" y="' + (ly - 11) + '" width="16" height="14" rx="3"/><text class="fac-txt" x="' + (L + 8) + '" y="' + (ly) + '" text-anchor="middle">階</text><text class="sub-txt" x="' + (L + 22) + '" y="' + ly + '">階段</text>');
    h.push('<rect class="fac" x="' + (L + 62) + '" y="' + (ly - 11) + '" width="16" height="14" rx="3"/><text class="fac-txt" x="' + (L + 70) + '" y="' + ly + '" text-anchor="middle">エ</text><text class="sub-txt" x="' + (L + 84) + '" y="' + ly + '">エスカレーター</text>');
    h.push('<rect class="fac" x="' + (L + 172) + '" y="' + (ly - 11) + '" width="22" height="14" rx="3"/><text class="fac-txt" x="' + (L + 183) + '" y="' + ly + '" text-anchor="middle">EV</text><text class="sub-txt" x="' + (L + 200) + '" y="' + ly + '">エレベーター</text>');
    var H = ly + 12;
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" role="img" aria-label="ホームと電車の位置">' + h.join('') + '</svg>';
  }

  // 段差なしで行けないとき、行ける出入口を提案する
  function noRoute(st, from, to, pr) {
    var exitSide = from.type === 'exit' ? 'from' : 'to';
    var chosen = exitSide === 'from' ? from : to;
    var meta = st._meta, base = st.nodes[meta.exits[chosen.id][0]];
    var alts = [];
    Guide.exitNames(st).forEach(function (n) {
      if (n === chosen.id) return;
      var e = { type: 'exit', id: n };
      var g = exitSide === 'from' ? Guide.guide(st, e, to, pr) : Guide.guide(st, from, e, pr);
      if (!g) return;
      var o = st.nodes[meta.exits[n][0]], d = Math.hypot(o[0] - base[0], o[1] - base[1]);
      alts.push({ n: n, d: d, min: g.minutes });
    });
    alts.sort(function (a, b) { return a.d - b.d; });
    var msg = pr === 'ev'
      ? '<b>' + esc(chosen.id) + '出入口からは、段差なしで行ける経路がデータにありません。</b>エレベーターのある出入口を使ってください。'
      : '<b>経路が見つかりませんでした。</b>';
    return '<div class="notice">' + msg + (alts.length ? '<div class="alts">' + alts.slice(0, 4).map(function (a) {
      return '<button type="button" data-alt="' + esc(a.n) + '" data-side="' + exitSide + '"><span class="exitbadge">' + esc(a.n) + '</span>' +
        esc(chosen.id) + 'から直線で約' + Math.round(a.d / 10) * 10 + 'm・駅の中は約' + a.min + '分</button>';
    }).join('') + '</div>' : '') + '</div>';
  }
  function bindAlts() {
    document.querySelectorAll('[data-alt]').forEach(function (b) {
      b.addEventListener('click', function () { $(b.dataset.side).value = 'exit:' + b.dataset.alt; run(); });
    });
  }

  // 手順と断面図を連動させる
  function bindHover() {
    var lis = document.querySelectorAll('ol.steps li'), gs = document.querySelectorAll('.seg-g');
    var pinned = -1;
    View3D.onStep = function (i) {
      lis.forEach(function (l) { l.classList.toggle('on', +l.dataset.i === i); });
      gs.forEach(function (gg) { gg.classList.toggle('on', +gg.dataset.i === i); });
      View3D.highlight(i);
    };
    function set(i) {
      if (i < 0) i = pinned;
      lis.forEach(function (l) { l.classList.toggle('on', +l.dataset.i === i); });
      gs.forEach(function (gg) { gg.classList.toggle('on', +gg.dataset.i === i); });
      View3D.highlight(i);
    }
    lis.forEach(function (l) {
      l.addEventListener('mouseenter', function () { set(+l.dataset.i); });
      l.addEventListener('mouseleave', function () { set(-1); });
      l.addEventListener('click', function () {
        var i = +l.dataset.i;
        pinned = pinned === i ? -1 : i;
        set(pinned); View3D.focus(pinned);
      });
    });
    gs.forEach(function (gg) {
      gg.addEventListener('mouseenter', function () { set(+gg.dataset.i); });
      gg.addEventListener('mouseleave', function () { set(-1); });
    });
  }

  // 初期状態: 大門駅 A3出入口 → 4番線（赤羽橋方面）
  var start = STATIONS.findIndex(function (s) { return s.name === '大門'; });
  setStation(start < 0 ? 0 : start, 'exit:A3', 'plat:421P4');
  // 日本語フォントが届いたら、立体図のラベルを描き直す
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { run(); });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { run(); });
  new MutationObserver(function () { run(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>

</body>
</html>
